name: Reusable Go distribution release

on:
  workflow_call:
    inputs:
      module:
        description: Exact canonical Go module path for the distribution.
        required: true
        type: string
      workflow_commit:
        description: Immutable commit used in this reusable workflow's uses reference.
        required: true
        type: string

# The caller grants the aggregate ceiling, while each job receives only its
# phase-specific authority. Candidate code never receives release authority.
permissions: {}

env:
  GOENV: "off"
  GOPROXY: "off"
  GOSUMDB: "off"
  GOTOOLCHAIN: local
  GOWORK: "off"
  RELEASE_PROFILE: go-distribution-v1
  TRUSTED_DEVELOPMENT_COMMIT: 73ec26480db3247cd93c8325080058e118b845c9
  TRUSTED_TOOLCHAIN_COMMIT: aeb2b789fedf5b7a45f0d0869043c8568161edad

concurrency:
  group: go-distribution-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate exact distribution candidate without release authority
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          path: candidate
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up exact Go toolchain without shared caches
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          cache: false
          go-version: 1.26.5
      - name: Require an authorized exact semantic-version tag
        shell: bash
        env:
          MODULE: ${{ inputs.module }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          WORKFLOW_COMMIT: ${{ inputs.workflow_commit }}
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          [[ "$GITHUB_REPOSITORY_OWNER" == spice-framework ]]
          [[ "$REPOSITORY_VISIBILITY" == public ]]
          [[ "$GITHUB_REF_TYPE" == tag ]]
          [[ "$GITHUB_REF_NAME" =~ $semver ]]
          [[ "$WORKFLOW_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          repository="${GITHUB_REPOSITORY#*/}"
          [[ "$repository" != starter-* ]]
          [[ "$MODULE" == "github.com/spice-framework/$repository" ]]
          test "$(git -C candidate rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C candidate rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          git -C candidate show-ref --verify --quiet refs/remotes/origin/main
          git -C candidate merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          test "$(go -C candidate list -m -mod=readonly)" = "$MODULE"
          test "$(git -C candidate status --porcelain=v1 --untracked-files=all)" = ""
      - name: Bootstrap candidate-owned pinned tools without release authority
        shell: bash
        env:
          GOCACHE: ${{ runner.temp }}/candidate-go-build-cache
          GOMODCACHE: ${{ runner.temp }}/candidate-go-module-cache
          GOPRIVATE: ""
          GONOPROXY: ""
          GONOSUMDB: ""
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        run: |
          make -C candidate tools-bootstrap
          test "$(git -C candidate status --porcelain=v1 --untracked-files=all)" = ""
      - name: Exercise candidate-owned release checks offline
        shell: bash
        env:
          GOCACHE: ${{ runner.temp }}/candidate-go-build-cache
          GOMODCACHE: ${{ runner.temp }}/candidate-go-module-cache
          GOPRIVATE: ""
          GONOPROXY: ""
          GONOSUMDB: ""
          GOPROXY: "off"
          GOSUMDB: "off"
        run: |
          make -C candidate verify-release
          test "$(git -C candidate status --porcelain=v1 --untracked-files=all)" = ""

  render:
    name: Render with immutable central distribution builder
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Validate immutable trusted implementation pins
        shell: bash
        run: |
          [[ "$TRUSTED_DEVELOPMENT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TRUSTED_TOOLCHAIN_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TRUSTED_DEVELOPMENT_COMMIT" != 0000000000000000000000000000000000000000 ]]
          [[ "$TRUSTED_TOOLCHAIN_COMMIT" != 0000000000000000000000000000000000000000 ]]
      - name: Check out inert exact candidate input
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          path: candidate
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Check out immutable trusted renderer source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          path: trusted/development
          persist-credentials: false
          ref: ${{ env.TRUSTED_DEVELOPMENT_COMMIT }}
          repository: spice-framework/development
      - name: Set up exact Go toolchain without shared caches
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          cache: false
          go-version: 1.26.5
      - name: Revalidate immutable inputs
        shell: bash
        run: |
          test "$(git -C candidate rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C candidate rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          git -C candidate show-ref --verify --quiet refs/remotes/origin/main
          git -C candidate merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          test "$(git -C trusted/development rev-parse HEAD)" = "$TRUSTED_DEVELOPMENT_COMMIT"
      - name: Build trusted renderer offline
        shell: bash
        env:
          GOCACHE: ${{ runner.temp }}/trusted-development-go-build-cache
          GOMODCACHE: ${{ runner.temp }}/trusted-development-go-module-cache
        run: |
          mkdir -p "$RUNNER_TEMP/trusted-bin"
          go build \
            -C trusted/development \
            -buildvcs=false \
            -mod=vendor \
            -trimpath \
            -o "$RUNNER_TEMP/trusted-bin/spice-dev" \
            ./cmd/spice-dev
      - name: Render exact-commit Go distribution artifacts
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY#*/}"
          "$RUNNER_TEMP/trusted-bin/spice-dev" \
            distribution-release render \
            --root="$GITHUB_WORKSPACE/candidate" \
            --repo="$repository" \
            --version="$GITHUB_REF_NAME" \
            --output="$RUNNER_TEMP/go-distribution-release-rendered"
      - name: Recheck renderer-owned reproducibility contract
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY#*/}"
          "$RUNNER_TEMP/trusted-bin/spice-dev" \
            distribution-release verify \
            --root="$GITHUB_WORKSPACE/candidate" \
            --repo="$repository" \
            --version="$GITHUB_REF_NAME" \
            --artifacts="$RUNNER_TEMP/go-distribution-release-rendered"
      - name: Transfer rendered distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: go-distribution-release-rendered
          path: ${{ runner.temp }}/go-distribution-release-rendered/
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Verify with immutable independent implementation
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out inert exact candidate input
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          path: candidate
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Check out immutable independent verifier source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          path: trusted/toolchain
          persist-credentials: false
          ref: ${{ env.TRUSTED_TOOLCHAIN_COMMIT }}
          repository: spice-framework/toolchain
      - name: Set up exact Go toolchain without shared caches
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          cache: false
          go-version: 1.26.5
      - name: Revalidate immutable inputs
        shell: bash
        run: |
          test "$(git -C candidate rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C candidate rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          git -C candidate show-ref --verify --quiet refs/remotes/origin/main
          git -C candidate merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          test "$(git -C trusted/toolchain rev-parse HEAD)" = "$TRUSTED_TOOLCHAIN_COMMIT"
      - name: Receive renderer output
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: go-distribution-release-rendered
          path: ${{ runner.temp }}/go-distribution-release-rendered
      - name: Build independent verifier offline
        shell: bash
        env:
          GOCACHE: ${{ runner.temp }}/trusted-toolchain-go-build-cache
          GOMODCACHE: ${{ runner.temp }}/trusted-toolchain-go-module-cache
        run: |
          mkdir -p "$RUNNER_TEMP/trusted-bin"
          go build \
            -C trusted/toolchain \
            -buildvcs=false \
            -mod=vendor \
            -trimpath \
            -o "$RUNNER_TEMP/trusted-bin/spice-go-distribution-release-verify" \
            ./cmd/spice-go-distribution-release-verify
      - name: Independently verify distribution artifacts
        shell: bash
        env:
          MODULE: ${{ inputs.module }}
        run: |
          repository="${GITHUB_REPOSITORY#*/}"
          "$RUNNER_TEMP/trusted-bin/spice-go-distribution-release-verify" \
            -artifacts="$RUNNER_TEMP/go-distribution-release-rendered" \
            -verified-output="$RUNNER_TEMP/go-distribution-release-verified" \
            -root="$GITHUB_WORKSPACE/candidate" \
            -repository="$repository" \
            -source="https://github.com/$GITHUB_REPOSITORY" \
            -module="$MODULE" \
            -version="$GITHUB_REF_NAME" \
            -commit="$GITHUB_SHA" \
            -profile="$RELEASE_PROFILE"
      - name: Transfer only independently verified artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: go-distribution-release-verified
          path: ${{ runner.temp }}/go-distribution-release-verified/
          if-no-files-found: error
          retention-days: 1

  execute:
    name: Execute independently verified distribution (${{ matrix.runner }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            ephemeral_runner: ""
          - runner: windows-2025
            ephemeral_runner: "1"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          path: candidate
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up exact Go toolchain without shared caches
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          cache: false
          go-version: 1.26.5
      - name: Receive only independently verified distribution artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: go-distribution-release-verified
          path: ${{ runner.temp }}/go-distribution-release-verified
      - name: Require the closed verifier-owned distribution artifact set
        shell: bash
        run: |
          artifacts="$RUNNER_TEMP/go-distribution-release-verified"
          test -d "$artifacts"
          test "$(find "$artifacts" -type l -print -quit)" = ""
          test "$(find "$artifacts" -mindepth 1 -maxdepth 1 ! -type f -print -quit)" = ""
          test "$(find "$artifacts" -maxdepth 1 -type f | wc -l)" -eq 9
          test "$(find "$artifacts" -maxdepth 1 -type f -size +536870912c -print -quit)" = ""
      - name: Execute the candidate-owned installed-byte gate offline
        shell: bash
        env:
          GOCACHE: ${{ runner.temp }}/candidate-go-build-cache
          GOMODCACHE: ${{ runner.temp }}/candidate-go-module-cache
          GOPRIVATE: ""
          GONOPROXY: ""
          GONOSUMDB: ""
          SPICE_DISTRIBUTION_EPHEMERAL_RUNNER: ${{ matrix.ephemeral_runner }}
          SPICE_DISTRIBUTION_VERIFIED_ARTIFACT_DIR: ${{ runner.temp }}/go-distribution-release-verified
        run: make -C candidate verify-release-artifacts
      - name: Require the candidate checkout to remain clean
        if: ${{ always() }}
        shell: bash
        run: test "$(git -C candidate status --porcelain=v1 --untracked-files=all)" = ""

  attest:
    name: Keylessly attest independently verified distribution artifacts
    needs: [verify, execute]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-attestation
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Receive only independently verified artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: go-distribution-release-verified
          path: ${{ runner.temp }}/go-distribution-release-verified
      - name: Require the closed bounded distribution artifact set
        shell: bash
        run: |
          artifacts="$RUNNER_TEMP/go-distribution-release-verified"
          test -d "$artifacts"
          test "$(find "$artifacts" -type l -print -quit)" = ""
          test "$(find "$artifacts" -mindepth 1 -maxdepth 1 ! -type f -print -quit)" = ""
          test "$(find "$artifacts" -maxdepth 1 -type f | wc -l)" -eq 9
          test "$(find "$artifacts" -maxdepth 1 -type f -size +536870912c -print -quit)" = ""
      - name: Generate Sigstore-backed SLSA provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/go-distribution-release-verified/*
      - name: Stage portable attestation bundle
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          test -f "$BUNDLE_PATH"
          test ! -L "$BUNDLE_PATH"
          mkdir -p "$RUNNER_TEMP/go-distribution-release-attestation"
          cp -- "$BUNDLE_PATH" "$RUNNER_TEMP/go-distribution-release-attestation/provenance.sigstore.json"
      - name: Transfer artifacts and attestation bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: go-distribution-release-attested
          path: |
            ${{ runner.temp }}/go-distribution-release-verified/
            ${{ runner.temp }}/go-distribution-release-attestation/
          if-no-files-found: error
          retention-days: 1

  verify_attestation:
    name: Authenticate keyless provenance before publication
    needs: attest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Receive attested artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: go-distribution-release-attested
          path: ${{ runner.temp }}/go-distribution-release-attested
      - name: Verify every artifact against the reusable workflow identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_COMMIT: ${{ inputs.workflow_commit }}
        run: |
          artifacts="$RUNNER_TEMP/go-distribution-release-attested/go-distribution-release-verified"
          bundle="$RUNNER_TEMP/go-distribution-release-attested/go-distribution-release-attestation/provenance.sigstore.json"
          test -f "$bundle"
          test ! -L "$bundle"
          while IFS= read -r -d '' artifact; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "$bundle" \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --signer-workflow spice-framework/.github/.github/workflows/go-distribution-release.yml \
              --signer-digest "$WORKFLOW_COMMIT" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners
          done < <(find "$artifacts" -maxdepth 1 -type f -print0 | sort -z)
      - name: Transfer authenticated release input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: go-distribution-release-authenticated
          path: ${{ runner.temp }}/go-distribution-release-attested/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish authenticated Go distribution
    needs: verify_attestation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-publish
    permissions:
      contents: write
    steps:
      - name: Check out inert exact candidate input
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          path: candidate
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Revalidate exact candidate and main ancestry
        shell: bash
        run: |
          test "$(git -C candidate rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C candidate rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          git -C candidate show-ref --verify --quiet refs/remotes/origin/main
          git -C candidate merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Receive only authenticated release input
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: go-distribution-release-authenticated
          path: ${{ runner.temp }}/go-distribution-release-authenticated
      - name: Publish immutable-tag distribution assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          resolve_remote_tag() {
            local direct peeled refs target
            refs="$(git -C candidate ls-remote --tags origin \
              "refs/tags/$GITHUB_REF_NAME" \
              "refs/tags/$GITHUB_REF_NAME^{}")"
            direct="$(printf '%s\n' "$refs" | awk -v ref="refs/tags/$GITHUB_REF_NAME" '$2 == ref { print $1 }')"
            peeled="$(printf '%s\n' "$refs" | awk -v ref="refs/tags/$GITHUB_REF_NAME^{}" '$2 == ref { print $1 }')"
            [[ "$direct" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]]
            if [[ -n "$peeled" ]]; then
              [[ "$peeled" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]]
              target="$peeled"
            else
              target="$direct"
            fi
            printf '%s %s\n' "$direct" "$target"
          }

          read -r direct_before target_before <<< "$(resolve_remote_tag)"
          test "$target_before" = "$GITHUB_SHA"
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          artifacts=("$RUNNER_TEMP/go-distribution-release-authenticated/go-distribution-release-verified"/*)
          attestations=("$RUNNER_TEMP/go-distribution-release-authenticated/go-distribution-release-attestation"/*)
          gh release create "$GITHUB_REF_NAME" \
            "${artifacts[@]}" \
            "${attestations[@]}" \
            --verify-tag \
            --generate-notes \
            --fail-on-no-commits \
            "${release_flags[@]}"
          read -r direct_after target_after <<< "$(resolve_remote_tag)"
          test "$target_after" = "$GITHUB_SHA"
          test "$direct_after" = "$direct_before"
