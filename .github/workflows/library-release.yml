name: Reusable library release

on:
  workflow_call:
    inputs:
      module:
        description: Exact canonical Go module path for the library.
        required: true
        type: string
      trusted_public_key:
        description: Repository-relative reviewed Ed25519 public-key PEM.
        required: false
        type: string
        default: security/release/ed25519-public.pem
    secrets:
      release_signing_key:
        description: Canonical PKCS#8 PEM or standard-base64 Ed25519 private key.
        required: true

permissions:
  contents: write

concurrency:
  group: library-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, sign, authenticate, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out exact tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache-dependency-path: go.sum
      - name: Require an exact semantic-version tag and trusted inputs
        shell: bash
        env:
          MODULE: ${{ inputs.module }}
          PUBLIC_KEY: ${{ inputs.trusted_public_key }}
        run: |
          [[ "$GITHUB_REF_TYPE" == tag ]]
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          [[ -n "$MODULE" ]]
          [[ "$PUBLIC_KEY" != /* && "$PUBLIC_KEY" != *..* ]]
          test -f "$PUBLIC_KEY"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
      - name: Verify release candidate
        run: make verify-release
      - name: Materialize external signing key
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.release_signing_key }}
        run: |
          test -n "$RELEASE_SIGNING_KEY"
          umask 077
          printf '%s' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/library-release.key"
      - name: Build signed exact-commit artifacts
        shell: bash
        env:
          GOFLAGS: -mod=vendor
          GOPROXY: "off"
          GOWORK: "off"
          PUBLIC_KEY: ${{ inputs.trusted_public_key }}
        run: |
          repository="${GITHUB_REPOSITORY#*/}"
          go tool github.com/spice-framework/development/cmd/spice-dev \
            library-release plan \
            --root=. \
            --repo="$repository" \
            --version="$GITHUB_REF_NAME" \
            > "$RUNNER_TEMP/library-release-plan.json"
          go tool github.com/spice-framework/development/cmd/spice-dev \
            library-release sign \
            --root=. \
            --plan="$RUNNER_TEMP/library-release-plan.json" \
            --output="$RUNNER_TEMP/library-release-artifacts" \
            --signing-key="$RUNNER_TEMP/library-release.key" \
            --trusted-public-key="$PUBLIC_KEY"
      - name: Independently authenticate artifacts
        shell: bash
        env:
          GOFLAGS: -mod=vendor
          GOPROXY: "off"
          GOWORK: "off"
          MODULE: ${{ inputs.module }}
          PUBLIC_KEY: ${{ inputs.trusted_public_key }}
        run: |
          repository="${GITHUB_REPOSITORY#*/}"
          go tool github.com/spice-framework/toolchain/cmd/spice-library-release-verify \
            -artifacts="$RUNNER_TEMP/library-release-artifacts" \
            -root=. \
            -repository="$repository" \
            -source="https://github.com/$GITHUB_REPOSITORY" \
            -module="$MODULE" \
            -version="$GITHUB_REF_NAME" \
            -commit="$GITHUB_SHA" \
            -trusted-public-key="$PUBLIC_KEY"
      - name: Remove signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/library-release.key"
      - name: Publish immutable-tag assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "$RUNNER_TEMP/library-release-artifacts"/*
          --verify-tag
          --generate-notes
          --fail-on-no-commits
